# backend/docker/nginx/default.conf

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        # Si la requête est de type OPTIONS
        if ($request_method = 'OPTIONS') {
            # On ajoute les en-têtes CORS nécessaires
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, DNT, User-Agent, X-Requested-With';
            add_header 'Access-Control-Max-Age' 86400;
            
            # On renvoie une réponse 204 "No Content", c'est la norme pour un preflight réussi
            return 204;
        }
        
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # 'backend' est le nom du service PHP dans docker-compose.yml
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}